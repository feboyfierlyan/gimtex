name: Feature request
description: Suggest an improvement to the code-context workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What workflow is difficult today?
      description: Explain the task and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include an example command or expected output if helpful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: What have you tried, and why does it fall short?
