name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Validate XML with an independent parser
        shell: bash
        run: |
          cargo run --locked -- . -i '*.rs' -f xml -o context.xml
          python -c 'import xml.etree.ElementTree as ET; root = ET.parse("context.xml").getroot(); assert root.tag == "codebase"; assert root.findall("./files/file")'
